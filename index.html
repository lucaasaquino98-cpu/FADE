<script>
/* ===== Supabase ===== */
const SB={url:'https://vuvqubozzukziuttbqkl.supabase.co',key:'sb_publishable_DZTXrZFsMrpAKac3unB7LQ_Q6JbT65G'};
const sb=window.supabase?window.supabase.createClient(SB.url,SB.key):null;
const TB={barb:'barbeiros',serv:'servicos',plan:'planos',cli:'clientes',ag:'agendamentos',pg:'pagamentos'};
let LAST={};
const snap=()=>{for(const k in TB)LAST[k]=new Map(S[k].map(r=>[r.id,JSON.stringify(r)]))};
/* Grava só o que mudou: novos/alterados (upsert) e removidos (delete). A RLS garante que cada barbearia só mexe nos próprios dados. */
async function sync(){if(!S.uid||!sb)return;
 try{for(const k in TB){const cur=S[k],old=LAST[k]||new Map(),ids=new Set(cur.map(r=>r.id));
  const up=cur.filter(r=>old.get(r.id)!==JSON.stringify(r)),del=[...old.keys()].filter(i=>!ids.has(i));
  if(up.length){const{error}=await sb.from(TB[k]).upsert(up.map(r=>({...r,dono_id:S.uid})));if(error)throw error}
  if(del.length){const{error}=await sb.from(TB[k]).delete().in('id',del);if(error)throw error}
  LAST[k]=new Map(cur.map(r=>[r.id,JSON.stringify(r)]))}
  const{error}=await sb.from('config').upsert({dono_id:S.uid,nome:S.nome,grupo:S.cfg.grupo,cor:S.cfg.cor,cor_menu:S.cfg.cormenu,logo:S.cfg.logo,tema:S.cfg.tema,msg_barb:S.cfg.msgb,msg_geral:S.cfg.msgg,boas:S.cfg.boas});if(error)throw error
 }catch(e){toast('Erro ao salvar: '+(e.message||e))}}
const save=()=>{sync()};
async function loadAll(){const rs=await Promise.all([...Object.values(TB).map(t=>sb.from(t).select('*')),sb.from('config').select('*').maybeSingle()]);
 const er=rs.find(r=>r.error);if(er)throw er.error;
 Object.keys(TB).forEach((k,i)=>S[k]=rs[i].data||[]);
 const c=rs[6].data;S.nome=c?.nome||'FADE';Object.assign(S.cfg,{grupo:c?.grupo||'',cor:c?.cor||'',cormenu:c?.cor_menu||'',logo:c?.logo||'',tema:c?.tema||'auto',msgb:c?.msg_barb||'',msgg:c?.msg_geral||'',boas:c?.boas||''});snap();
 if(!c){S.serv=[{id:nid(),nome:'Corte',preco:45,dur:30},{id:nid(),nome:'Barba',preco:30,dur:30},{id:nid(),nome:'Corte + Barba',preco:70,dur:60}];sync()}}
/* Autenticação por e-mail: cada barbearia tem a própria conta */
const erroAuth=m=>/Invalid login/i.test(m)?'E-mail ou senha incorretos':/already registered/i.test(m)?'Esse e-mail já tem conta':/at least 6/i.test(m)?'A senha precisa de 6 caracteres ou mais':m;
async function sessao(ses){if(!ses){if(V.role=='dono'){S.uid=null;V.role=null;render()}return}
 S.uid=ses.user.id;S.email=ses.user.email;try{await loadAll()}catch(e){toast('Erro ao carregar: '+(e.message||e))}entrar('dono')}
async function entrarEmail(){if(!sb)return toast('Sem conexão com o servidor');const e=$('#le').value.trim(),p=$('#lp').value;if(!e||!p)return toast('Informe e-mail e senha');
 const{error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)toast(erroAuth(error.message))}
async function criarConta(){if(!sb)return toast('Sem conexão com o servidor');const e=$('#le').value.trim(),p=$('#lp').value;if(!e||p.length<6)return toast('Informe e-mail e uma senha de 6+ caracteres');
 const{data,error}=await sb.auth.signUp({email:e,password:p});if(error)return toast(erroAuth(error.message));if(!data.session)toast('Conta criada! Confirme o e-mail para entrar')}
async function esqueci(){const e=$('#le').value.trim();if(!sb||!e)return toast('Digite seu e-mail acima');
 const{error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});toast(error?erroAuth(error.message):'Enviamos o link para o seu e-mail')}
/* Página pública: tudo passa pela Edge Function agenda-publica (sem login) */
async function api(a,d){const{data,error}=await sb.functions.invoke('agenda-publica',{body:{a,...d}});
 if(error){let m=error.message;try{m=(await error.context.json()).erro||m}catch(e){}throw new Error(m)}return data}
async function loadPub(){if(!sb)throw new Error('Sem conexão com o servidor');const i=await api('info',{shop:V.shop});V.pubCfg={cor:i.cor||'',logo:i.logo||'',boas:i.boas||'',tema:'auto'};S.nome=i.nome||'FADE';document.title=S.nome+' · Agendamento';S.barb=i.barbeiros;S.serv=i.servicos;S.ag=i.ocupados}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAYS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const D=o=>{const d=new Date();d.setDate(d.getDate()+o);return d};
const K=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fd=k=>k.slice(8)+'/'+k.slice(5,7);
const brl=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
const mn=h=>{const[a,b]=h.split(':');return +a*60+ +b};
const SL=[];for(let h=9;h<19;h++)['00','30'].forEach(x=>SL.push(String(h).padStart(2,'0')+':'+x));

/* ===== Ícones ===== */
const I={home:'<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M17 4.5a3.5 3.5 0 010 7M21.5 20c0-2.6-1.6-4.6-4-5.5"/>',
cut:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.6L20 18M8.6 16.4L20 6"/>',
tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
chart:'<path d="M4 20V11M10 20V4M16 20v-8M22 20H2"/>',
out:'<path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/>',
cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
face:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'};
const CUT=s=>`<svg viewBox="0 0 24 24" style="width:${s}px;height:${s}px;overflow:visible"><g class="sb"><circle cx="6" cy="18" r="3"/><path d="M8.6 16.4L20 6"/></g><g class="sa"><circle cx="6" cy="6" r="3"/><path d="M8.6 7.6L20 18"/></g></svg>`;
const logoOk=l=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(l||'');
const ico=(c,z)=>logoOk(c&&c.logo)?`<img src="${c.logo}" alt="" style="width:100%;height:100%;object-fit:cover">`:CUT(z);
const lum=h=>{const n=parseInt(h.slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255};
const mix=(h,t,a)=>{const n=parseInt(h.slice(1),16);return'#'+[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v+(t-v)*a).toString(16).padStart(2,'0')).join('')};
function applyTheme(c){const r=document.documentElement,st=r.style,t=c.tema||'auto',hx=/^#[0-9a-f]{6}$/i;
 t=='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',t);

 P=[['','Verde-azulado'],['#1d4ed8','Azul'],['#7c3aed','Roxo'],['#9f1239','Vinho'],['#c2410c','Laranja'],['#a16207','Dourado'],['#374151','Grafite']],
 N=[['','Azul-marinho'],['#0a0a0a','Preto'],['#1f2937','Grafite'],['#1e1b4b','Índigo'],['#052e2b','Verde-escuro'],['#3b0a1a','Vinho']],
 sw=(k,l,v)=>l.map(x=>`<button class="sw ${(c[k]||'')==x[0]?'on':''}" style="background:${x[0]||v}" title="${x[1]}" aria-label="${x[1]}" onclick="setCfg('${k}','${x[0]}')"></button>`).join(''),g=dv('c_grupo',c.grupo),W='style="max-width:560px;margin-bottom:12px"';
 return`<div class="top"><h1>Configurações</h1></div>
 <div class="card" ${W}><h3>Aparência</h3><small class="hint">As mudanças de tema e cor valem na hora.</small>
 <div class="chips" style="margin-top:8px">${T.map(x=>`<button class="chip ${(c.tema||'auto')==x[0]?'on':''}" onclick="setCfg('tema','${x[0]}')">${x[1]}</button>`).join('')}</div>
 <small class="hint">Cor do sistema</small><div class="chips" style="align-items:center">${sw('cor',P,'#0f766e')}<input type="color" value="${hx.test(c.cor)?c.cor:'#0f766e'}" onchange="setCfg('cor',this.value)" title="Cor personalizada" aria-label="Cor personalizada"></div>
 <small class="hint">Cor do menu</small><div class="chips" style="margin:0">${sw('cormenu',N,'#0b1220')}</div></div>
 <div class="card" ${W}><h3>Identidade</h3><div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><div class="ph">${ico(c,32)}</div>
 <div><label class="btn s p">Escolher foto<input type="file" accept="image/*" hidden onchange="fotoCfg(this)"></label>${logoOk(c.logo)?` <button class="btn s d" onclick="setCfg('logo','')">Remover</button>`:''}<p class="hint" style="margin:6px 0 0">Aparece no menu e na página de agendamento dos clientes.</p></div></div>
 <label class="fl"><small>Nome da barbearia</small><input id="c_nome" value="${esc(dv('c_nome',S.nome))}"></label>
 <label class="fl"><small>Mensagem de boas-vindas na página de agendamento (opcional)</small><input id="c_boas" maxlength="160" value="${esc(dv('c_boas',c.boas))}" placeholder="Ex.: Atendemos de terça a sábado. Chegue 5 min antes."></label></div>
 <div class="card" ${W}><h3>WhatsApp</h3><label class="fl"><small>Link do grupo dos barbeiros</small><input id="c_grupo" type="url" inputmode="url" placeholder="https://chat.whatsapp.com/..." value="${esc(g)}"></label>
 <p class="hint">No WhatsApp: toque no nome do grupo, depois em Convidar via link e copie. Os botões "Enviar no WhatsApp" abrem esse grupo direto. O WhatsApp não aceita texto pronto em grupo, então o app copia a mensagem e você só cola.</p>
 <label class="fl"><small>Mensagem para o barbeiro (link individual)</small><textarea id="c_msgb" rows="3" placeholder="${esc(MSGB)}">${esc(dv('c_msgb',c.msgb))}</textarea></label>
 <label class="fl"><small>Mensagem do link geral</small><textarea id="c_msgg" rows="3" placeholder="${esc(MSGG)}">${esc(dv('c_msgg',c.msgg))}</textarea></label>
 <p class="hint">Use {barbeiro}, {barbearia} e {link}. Em branco, vale a mensagem padrão (a do exemplo).</p>
 <div class="acts" style="justify-content:flex-start"><button class="btn p" onclick="salvarCfg()">Salvar alterações</button>${c.grupo?`<a class="btn" href="${esc(c.grupo)}" target="_blank" rel="noopener">Testar grupo</a>`:''}</div></div>
 <div class="card" ${W}><h3>Conta</h3><p class="hint" style="margin:0">Conectado como <b>${esc(S.email||'')}</b>. Cada barbearia vê apenas os próprios dados.</p></div>`},
rel(){const w=[0,0,0,0,0,0,0],q={};let tot=0;S.ag.filter(a=>a.st=='ok'&&a.data>=K(D(-27))).forEach(a=>{w[new Date(a.data+'T00:00').getDay()]++;q[a.serv]=(q[a.serv]||0)+1;tot++});
 const rk=S.serv.map(s=>[s.nome,q[s.id]||0]).sort((a,b)=>b[1]-a[1]),mx=Math.max(...rk.map(r=>r[1]),1);
 return`<div class="top"><h1>Relatórios</h1><span class="hint" style="margin:0">últimos 28 dias</span></div>
 <div class="kpis">${kpi('Atendimentos',tot)}${kpi('Serviços avulsos (mês)',brl(fatServ()))}${kpi('Mensalidades (mês)',brl(fatPlan()))}${kpi('Assinantes vencidos',S.cli.filter(c=>c.plano&&dv(c)<0).length)}</div>
 <div class="two"><div class="card"><h3>Movimento por dia da semana</h3>${bars([1,2,3,4,5,6,0].map(i=>w[i]),[1,2,3,4,5,6,0].map(i=>DS[i]))}</div>
 <div class="card"><h3>Faturado por barbeiro (mês)</h3>${bars(S.barb.map(b=>fatServ(b.id)),S.barb.map(b=>b.nome.split(' ')[0]))}</div></div>
 <div class="card" style="margin-top:12px"><h3>Cortes e serviços mais pedidos</h3>${rk.map(r=>`<div style="margin-bottom:8px"><div class="row" style="border:0;padding:0"><span>${esc(r[0])}</span><b>${r[1]}</b></div><div class="bar"><i style="width:${r[1]/mx*100}%"></i></div></div>`).join('')}</div>`}
};

/* ===== Página pública de agendamento (link enviado aos clientes, sem login) ===== */
function pub(){if(V.pubLoad)return'<div class="pgw"><div class="pg"><p class="hint">Carregando…</p></div></div>';if(V.pubErr)return`<div class="pgw"><div class="pg"><div class="card"><h3>Não foi possível abrir o agendamento</h3><p class="hint" style="margin:0">${esc(V.pubErr)}</p></div></div></div>`;const b=V.bk,k=K(D(b.dia??0)),s=b.serv&&sv(b.serv),a=b.done,hd=`<div class="brandp"><i style="color:#fff">${ico(V.pubCfg||{},18)}</i>${esc(S.nome)}</div>`,n=V.fixB?1:0;
 if(a)return`<div class="pgw"><div class="pg">${hd}<div class="card" style="text-align:center"><span class="tag" style="font-size:13px;padding:4px 14px">Horário confirmado</span><h1 style="margin:14px 0 6px">${DAYS[new Date(a.data+'T00:00').getDay()]}, ${fd(a.data)} às ${a.hora}</h1><p class="hint">${esc(sv(a.serv).nome)} com ${esc(bn(a.barb).nome)}</p><a class="btn p g" target="_blank" rel="noopener" href="${waUrl(bn(a.barb).tel,'Olá! Agendei '+sv(a.serv).nome+' para '+fd(a.data)+' às '+a.hora+'.')}">Avisar o barbeiro no WhatsApp</a><button class="btn g" style="margin-top:8px" onclick="V.bk=bk0();render()">Agendar outro horário</button></div></div></div>`;
 return`<div class="pgw"><div class="pg">${hd}<h1 style="margin-bottom:4px">Agende seu horário</h1><p class="hint">${V.pubCfg?.boas?esc(V.pubCfg.boas)+' ':''}${V.fixB?'Com '+esc(bn(V.fixB).nome)+'. ':''}Escolha o serviço, o dia e um horário livre.</p>
 <div class="card"><h3>1. Serviço</h3><div class="chips">${S.serv.map(x=>`<button class="chip ${b.serv==x.id?'on':''}" onclick="bk('serv',${x.id})">${esc(x.nome)} · ${brl(x.preco)}</button>`).join('')}</div>
 ${V.fixB?'':`<h3>2. Barbeiro</h3><div class="chips">${S.barb.map(x=>`<button class="chip ${b.barb==x.id?'on':''}" onclick="bk('barb',${x.id})">${esc(x.nome)}</button>`).join('')}</div>`}
 <h3>${2+(1-n)}. Dia</h3><div class="chips">${[...Array(14).keys()].map(i=>`<button class="chip ${(b.dia??0)==i?'on':''}" onclick="bk('dia',${i})">${i==0?'Hoje':DS[D(i).getDay()]+' '+fd(K(D(i)))}</button>`).join('')}</div>
 <h3>${3+(1-n)}. Horário</h3>${s&&b.barb?`<div class="chips">${SL.filter(h=>free(b.barb,k,h,s.dur)).map(h=>`<button class="chip ${b.hora==h?'on':''}" onclick="bk('hora','${h}')">${h}</button>`).join('')||'<span class="hint">Sem horários livres neste dia. Tente outro dia.</span>'}</div>`:'<p class="hint">Escolha '+[!s&&'o serviço',!b.barb&&'o barbeiro'].filter(Boolean).join(' e ')+' para ver os horários livres.</p>'}
 <h3>Seus dados</h3><p class="hint">Informe o celular ou o CPF: se você já é cliente, encontramos o seu cadastro.</p>
 <label class="fl"><small>Celular com DDD</small><input type="tel" inputmode="tel" autocomplete="tel" placeholder="(81) 98888-7777" value="${esc(b.tel||'')}" oninput="this.value=V.bk.tel=mTel(this.value);lookup()"></label>
 <label class="fl"><small>CPF</small><input inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" value="${esc(b.cpf||'')}" oninput="this.value=V.bk.cpf=mCpf(this.value);lookup()"></label>
 <p id="hello" class="hint" style="color:var(--pr);font-weight:600">${hello()}</p>
 <label class="fl"><small id="nlb">Nome${V.bk.found?' (opcional, já temos o seu)':''}</small><input value="${esc(b.nome||'')}" oninput="V.bk.nome=this.value" autocomplete="name"></label>
 <p class="hint">Ao agendar, você autoriza o uso dos seus dados apenas para o atendimento.</p>
 <button class="btn p g" onclick="confirmarBk()">Confirmar agendamento</button></div></div></div>`}

/* ===== Estrutura ===== */
const ND=[['painel','Visão geral','home'],['agenda','Agenda','cal'],['barb','Barbeiros','users'],['cli','Clientes','face'],['serv','Cortes','cut'],['plan','Planos','tag'],['rel','Relatórios','chart'],['config','Configurações','cog','Config.']];
const NB=[['painel','Meu dia','home'],['agenda','Agenda','cal'],['cli','Clientes','face']];
function login(){return`<div class="lg"><div class="box"><div class="tile" style="color:#fff">${CUT(50)}</div><h2>FADE</h2><p>Agenda, cortes e mensalidade da sua barbearia</p>
 <input id="le" type="email" placeholder="E-mail" autocomplete="username"><input id="lp" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key=='Enter')entrarEmail()">
 <button class="btn" onclick="entrarEmail()">Entrar</button>
 <button class="btn o" onclick="criarConta()">Criar conta da barbearia</button>
 <button class="btn o" style="background:none;font-size:13px;padding:8px;color:#94a3b8" onclick="esqueci()">Esqueci a senha</button></div></div>`}
function shell(items,body){const u=V.role=='dono'?'Dono':bn(V.uid).nome,rl={dono:'Barbearia',barb:'Barbeiro'}[V.role];
 return`<div class="app"><nav><div class="brand"><i style="color:#fff">${ico(S.cfg,18)}</i><span>${esc(S.nome)}</span></div><div class="lb">${rl}</div>
 ${items.map(i=>`<button class="${V.tab==i[0]?'on':''}" onclick="go('${i[0]}')">${ic(i[2])}${i[3]?`<span class="dsk">${i[1]}</span><span class="mob">${i[3]}</span>`:`<span>${i[1]}</span>`}</button>`).join('')}
 <div class="sp"></div><div class="usr"><b>${esc(u[0])}</b><div>${esc(u.split(' ')[0])}<small>${rl}</small></div></div>
 <button class="lgo" onclick="sair()">${ic('out',18)}<span>Sair</span></button></nav><main>${body}</main></div>`}
function render0(){applyTheme(V.role=='pub'?(V.pubCfg||{}):V.role?S.cfg:{});const el=$('#app');if(V.role=='pub'){el.innerHTML=pub();return}if(!V.role){el.innerHTML=login();return}
 const R={dono:[ND,PV],barb:[NB,PV]}[V.role];el.innerHTML=shell(R[0],R[1][V.tab]())+mdl()}
/* Mantém a rolagem ao redesenhar a tela (escolher dia/horário não volta ao topo) */
function render(){const o=$('.pgw')||$('main'),y=o?o.scrollTop:0,c=o&&o.className=='pgw'?'.pgw':'main';render0();const n=$(c);if(n&&y)n.scrollTop=y}
function route(){const m=location.hash.match(/^#agendar\/([0-9a-f-]{36})(?:\/(\d+))?$/);
 if(m){V.role='pub';V.shop=m[1];V.bk={};V.pubLoad=true;V.pubErr='';render();
  loadPub().then(()=>{V.fixB=m[2]&&S.barb.some(b=>b.id==m[2])?+m[2]:0;V.bk=bk0()}).catch(e=>V.pubErr=e.message||'Erro').finally(()=>{V.pubLoad=false;render()})}
 else if(V.role=='pub'){V.role=null;render();sb&&sb.auth.getSession().then(r=>r.data.session&&sessao(r.data.session))}
 else render()}
addEventListener('hashchange',route);route();
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>render())}catch(e){}
if(sb){sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(()=>{
 if(ev=='SIGNED_OUT')sessao(null);
 else if(V.role!='pub'&&V.role!='dono'&&(ev=='INITIAL_SESSION'||ev=='SIGNED_IN'||ev=='PASSWORD_RECOVERY')&&ses)sessao(ses).then(()=>{if(ev=='PASSWORD_RECOVERY')form('Defina uma nova senha',[{id:'p',l:'Nova senha (mín. 6 caracteres)',ty:'password'}],v=>{if(v.p.length<6)return toast('Mínimo de 6 caracteres')&&false;sb.auth.updateUser({password:v.p}).then(r=>toast(r.error?erroAuth(r.error.message):'Senha atualizada'))},'Salvar')})},0)});
 setInterval(()=>{if(V.role=='dono'&&!M&&document.visibilityState=='visible'&&!document.activeElement?.matches('input,select'))loadAll().then(render).catch(()=>{})},30000)}
(()=>{const sp=$('#splash');
 if(/^#agendar\//.test(location.hash)){sp.remove();return}
 sp.innerHTML=`<div class="tile" style="color:#fff">${CUT(50)}</div><h2>FADE</h2><div class="ld"><i></i></div>`;
 setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),450)},matchMedia('(prefers-reduced-motion:reduce)').matches?300:1900)})();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
